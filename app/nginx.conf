server {
    if ($host = avatars.labskit.ru) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name avatars.labskit.ru;
    return 301 https://$host$request_uri;
}
curl -H "Authorization: Basic ZXRydXNoZW5rb3ZAZ21haWwuY29t:fnYg60Ph7Fm-uSNcg-q1F" https://api.d-id.com/agents/v2_agt_ODP2-9pe  
server {
    listen 443 ssl;
    server_name avatars.labskit.ru;
    ssl_certificate /etc/letsencrypt/live/avatars.labskit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avatars.labskit.ru/privkey.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /did-sdk/ {
        proxy_pass https://agent.d-id.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host agent.d-id.com;
        proxy_set_header Accept-Encoding "";
        sub_filter 'https://agent.d-id.com' 'https://avatars.labskit.ru/did-proxy/agent';
        sub_filter 'https://api.d-id.com' 'https://avatars.labskit.ru/did-proxy/api';
        sub_filter 'wss://agent.d-id.com' 'wss://avatars.labskit.ru/did-proxy/agent';
        sub_filter 'wss://api.d-id.com' 'wss://avatars.labskit.ru/did-proxy/api';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
    }

    location ~ ^/did-proxy/agent {
        rewrite ^/did-proxy/agent(.*) /$1 break;
        proxy_pass https://agent.d-id.com;
        proxy_ssl_server_name on;
        proxy_set_header Host agent.d-id.com;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /did-proxy/api/ {
        proxy_pass https://api.d-id.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.d-id.com;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}
